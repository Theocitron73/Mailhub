name: Installateurs et Mises à jour MailHub

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              dist/*.exe
              dist/latest.yml
          - os: macos-latest
            script: dist:mac
            files: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm test

      - name: Vérifier les ressources d'icônes
        shell: bash
        run: |
          mkdir -p build
          if [ ! -f "build/icon.icns" ] && [ -f "node_modules/app-builder-lib/templates/icons/proton-native/proton-native.icns" ]; then
            cp node_modules/app-builder-lib/templates/icons/proton-native/proton-native.icns build/icon.icns
          fi
          if [ ! -f "build/icon.png" ] && [ -f "node_modules/app-builder-lib/templates/icons/proton-native/linux/1024x1024.png" ]; then
            cp node_modules/app-builder-lib/templates/icons/proton-native/linux/1024x1024.png build/icon.png
          fi

      - name: Dépendances macOS (dmg-license)
        if: runner.os == 'macOS'
        run: npm install dmg-license --no-save

      - name: Préparation environnement macOS (désactivation Spotlight & nettoyage volumes)
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true
          rm -rf dist/mac*
          hdiutil info | grep -o '/Volumes/MailHub.*' | while read -r vol; do
            hdiutil detach "$vol" -force || true
          done

      # Construction de l'installateur
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installateur-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: warn

  # Application Android (Capacitor + Node.js embarqué)
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm install

      - run: npm test

      - name: Dépendances Capacitor
        working-directory: mobile
        run: npm ci

      - name: Interface et moteur mail pour Android
        run: npm run mobile:build

      - name: Synchronisation Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Clé de signature
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mailhub.jks"
          echo "MAILHUB_KEYSTORE=$RUNNER_TEMP/mailhub.jks" >> "$GITHUB_ENV"

      # Avec la clé : APK signé, publié avec la version. Sans clé : APK de test (débogage) seulement.
      - name: Construction de l'APK
        working-directory: mobile/android
        env:
          MAILHUB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAILHUB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAILHUB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('../../package.json').version")
          mkdir -p ../../dist
          if [ "$HAS_KEY" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../../dist/MailHub-${VERSION}.apk"
          else
            echo "::warning::Secrets de signature Android absents : APK de test non publié (voir README, section Android)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../../dist/MailHub-${VERSION}-test.apk"
          fi

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: installateur-android
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY != 'true'
        with:
          name: apk-test-android
          path: dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer la version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: installateurs
          pattern: installateur-*
          merge-multiple: true

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: MailHub v${{ steps.pkg.outputs.version }}
          files: installateurs/*
          generate_release_notes: true
