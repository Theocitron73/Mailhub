name: Installateurs et Mises à jour MailHub

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              dist/*.exe
              dist/latest.yml
          - os: macos-latest
            script: dist:mac
            files: |
              dist/*.dmg
              dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm test

      - name: Vérifier les ressources d'icônes
        shell: bash
        run: |
          mkdir -p build
          if [ ! -f "build/icon.icns" ] && [ -f "node_modules/app-builder-lib/templates/icons/proton-native/proton-native.icns" ]; then
            cp node_modules/app-builder-lib/templates/icons/proton-native/proton-native.icns build/icon.icns
          fi
          if [ ! -f "build/icon.png" ] && [ -f "node_modules/app-builder-lib/templates/icons/proton-native/linux/1024x1024.png" ]; then
            cp node_modules/app-builder-lib/templates/icons/proton-native/linux/1024x1024.png build/icon.png
          fi

      - name: Dépendances macOS (dmg-license)
        if: runner.os == 'macOS'
        run: npm install dmg-license --no-save

      - name: Préparation environnement macOS (désactivation Spotlight & nettoyage volumes)
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true
          hdiutil info | grep -o '/Volumes/MailHub.*' | while read -r vol; do
            hdiutil detach "$vol" -force || true
          done

      # Construction de l'installateur
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installateur-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer la version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: installateurs
          merge-multiple: true

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: MailHub v${{ steps.pkg.outputs.version }}
          files: installateurs/*
          generate_release_notes: true
