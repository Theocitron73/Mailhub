<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self'; frame-src about: blob:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MailHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="view-mail">
  <div id="app">
    <aside id="sidebar" aria-label="Comptes et dossiers">
      <div class="sb-drag"></div>
      <div class="sb-head">
        <button id="btn-compose" class="primary wide">Écrire</button>
      </div>
      <nav id="sb-nav" class="sb-scroll"></nav>
      <div class="sb-foot">
        <button id="nav-rules" class="sb-link"></button>
        <button id="nav-settings" class="sb-link"></button>
      </div>
    </aside>

    <div id="sb-splitter" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Redimensionner la colonne de gauche" title="Glisser pour redimensionner, double-clic pour rétablir"></div>

    <div id="tabbar" role="tablist" aria-label="Onglets" hidden></div>

    <!-- Vue « messages » : liste + lecture, dans la disposition choisie -->
    <div id="main" class="mode-right">
      <section id="list-pane" aria-label="Messages">
        <header class="list-head">
          <div class="list-title-row">
            <h1 id="list-title">Boîte unifiée</h1>
            <div class="list-tools">
              <div id="layout-switch" class="layout-switch" role="group" aria-label="Disposition de la lecture"></div>
              <button id="btn-refresh" class="icon-btn" title="Actualiser" aria-label="Actualiser"></button>
            </div>
          </div>
          <div class="search">
            <span class="search-icon" id="search-icon"></span>
            <input id="search" type="search" placeholder="Rechercher expéditeur ou objet" autocomplete="off" spellcheck="false">
          </div>
        </header>
        <div class="sort-row">
          <label for="sort-by">Trier par</label>
          <select id="sort-by" aria-label="Critère de tri de la liste">
            <option value="date">Date</option>
            <option value="from">Correspondant</option>
            <option value="subject">Objet</option>
          </select>
          <button id="sort-dir" class="icon-btn" aria-label="Inverser l’ordre"></button>
          <span id="sort-note" class="sort-note"></span>
          <button id="btn-sortnow" class="subtle" title="Applique vos règles de tri aux messages déjà présents dans ce dossier"></button>
        </div>
        <div id="selection-bar" class="selection-bar" hidden></div>
        <div id="list-rows" class="rows" tabindex="0" role="listbox" aria-label="Liste des messages"></div>
      </section>

      <div id="splitter" role="separator" tabindex="0" aria-label="Redimensionner la liste des messages" title="Glisser pour redimensionner, double-clic pour rétablir"></div>

      <main id="reader" aria-label="Lecture"></main>
    </div>

    <!-- Vue « panneau » : règles, réglages, accueil -->
    <section id="panel"></section>

    <!-- Vue « onglet » : message ouvert en grand ou pièce jointe -->
    <section id="tabview" aria-label="Onglet ouvert"></section>
  </div>

  <div id="drag-hint" hidden></div>
  <div id="modal-root"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
